name: Fusion Overnight ChatGPT Phases

on:
  pull_request:
    paths:
      - 01_BACKBONE/KAP/05_RUNS/KAP-RUN-20260731-OVERNIGHT-SIX-PHASE/**
      - data/master_ledger.csv
      - 08_LOGS/session-ledger/reconciliation/chatgpt-239/**
      - .github/workflows/fusion-overnight-chatgpt-phases.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fusion-overnight-chatgpt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phases-1-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Run deterministic overlay and coverage audit
        id: run
        shell: bash
        run: |
          set +e
          python3 01_BACKBONE/KAP/05_RUNS/KAP-RUN-20260731-OVERNIGHT-SIX-PHASE/run_chatgpt_phases_v2.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit generated evidence
        shell: bash
        run: |
          generated=01_BACKBONE/KAP/05_RUNS/KAP-RUN-20260731-OVERNIGHT-SIX-PHASE/generated/chatgpt
          if [ ! -d "$generated" ]; then
            echo "No generated evidence directory"
            exit 0
          fi
          git add -f "$generated"
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(fusion): generate ChatGPT overnight phases 1-2 evidence"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Enforce validation
        if: steps.run.outputs.status != '0'
        shell: bash
        run: |
          echo "ChatGPT phases returned status ${{ steps.run.outputs.status }}"
          exit "${{ steps.run.outputs.status }}"
