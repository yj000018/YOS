summary: >
  Validated end-to-end pipeline to extract ChatGPT conversations from a Business account
  that has native export disabled. Uses live Brave browser cookies from Mac, decrypted
  via macOS Keychain (GUI context only), transferred via SSH bore tunnel to Cloud Computer,
  then used as Bearer token for ChatGPT API. 3060 conversations ingested.

lessons:
  - id: "LL-001"
    title: "ChatGPT Business — export natif désactivé"
    category: "anti-pattern"
    severity: "critical"
    description: >
      ChatGPT Business/Team accounts have native data export DISABLED.
      Never propose Settings → Data Controls → Export as a solution.
    action: "Use Brave cookies pipeline instead."
    tags: ["chatgpt", "business", "anti-pattern"]

  - id: "LL-002"
    title: "Cloudflare bypass — seule solution viable"
    category: "architecture"
    severity: "critical"
    description: >
      Cloudflare Managed Challenge blocks all direct HTTP from servers via TLS fingerprinting.
      The only bypass: use live browser cookies (cf_clearance + session-token) from an active
      authenticated session. These cookies are tied to the browser's TLS fingerprint.
    action: "Extract cookies from Brave Mac session. Never try HTTP direct from CC."
    tags: ["cloudflare", "bypass", "cookies", "brave"]

  - id: "LL-003"
    title: "macOS Keychain — SSH headless bloqué (rc=36)"
    category: "infrastructure"
    severity: "high"
    description: >
      `security find-generic-password` from SSH headless returns rc=36 errSecInteractionNotAllowed.
      macOS TCC blocks Keychain access outside GUI sessions.
    solution: >
      Use osascript: `tell application "Terminal" to do script "python3 /tmp/script.py > /tmp/out.txt 2>&1"`
      This runs in GUI context with Keychain access. Poll with `grep -c DONE /tmp/out.txt`.
    tags: ["macos", "keychain", "ssh", "osascript"]

  - id: "LL-004"
    title: "Chrome/Brave AES decrypt — offset 32 critique"
    category: "technical"
    severity: "high"
    description: >
      After AES-128-CBC decryption of Chrome/Brave cookies, the first 32 bytes are
      Chrome metadata (not part of the actual value). The real content starts at offset 32.
      Format: v10 prefix (3 bytes) + AES payload. Key = PBKDF2-HMAC-SHA1(keychain_pw, 'saltysalt', 1003, 16).
      IV = b' ' * 16 (16 spaces).
    action: "Always slice: decrypted[32:] to get actual cookie value."
    tags: ["chrome", "brave", "aes", "decrypt", "offset"]

  - id: "LL-005"
    title: "Browser = Brave (pas Chrome)"
    category: "configuration"
    severity: "high"
    description: >
      Yannick uses Brave for ChatGPT, not Chrome. Cookie DB path differs.
      Brave: ~/Library/Application Support/BraveSoftware/Brave-Browser/Default/Cookies
      Chrome: ~/Library/Application Support/Google/Chrome/Default/Cookies
      Keychain service name also differs: 'Brave' vs 'Chrome Safe Storage'.
    tags: ["brave", "chrome", "cookies", "path"]

  - id: "LL-006"
    title: "ChatGPT API — timestamps ISO 8601"
    category: "technical"
    severity: "medium"
    description: >
      ChatGPT /backend-api/conversations returns timestamps as ISO 8601 strings
      (e.g., "2026-07-29T21:54:43Z"), NOT Unix float timestamps.
      Use datetime.fromisoformat() not datetime.fromtimestamp().
    tags: ["chatgpt", "api", "timestamps"]

  - id: "LL-007"
    title: "session-token splitté en .0 et .1"
    category: "technical"
    severity: "medium"
    description: >
      ChatGPT session-token is split across two cookies: __Secure-next-auth.session-token.0
      and __Secure-next-auth.session-token.1. Must concatenate both values before sending.
    tags: ["chatgpt", "session-token", "cookies"]

  - id: "LL-008"
    title: "Chrome Remote Debugging via SSH — impossible"
    category: "anti-pattern"
    severity: "medium"
    description: >
      Launching Chrome with --remote-debugging-port=9222 from SSH fails: Chrome Updater
      intercepts the launch and the debug port is never opened.
      osascript execute javascript also disabled by default.
    action: "Use cookie extraction approach instead of CDP."
    tags: ["chrome", "cdp", "ssh", "anti-pattern"]

  - id: "LL-009"
    title: "Y-OS règle — GitHub = source de vérité (Notion mort)"
    category: "architecture"
    severity: "critical"
    description: >
      All Y-OS knowledge, LLs, Tool Fact Sheets, registries → GitHub yj000018/YOS.
      Notion is deprecated. Never create new content in Notion.
      Structure: 02_AGENTS/<agent>/ for Tool Fact Sheets, 00_META/LESSONS-LEARNED/ for LL Registry.
    tags: ["yos", "github", "notion", "architecture", "rule"]

scripts:
  - path: "/home/ubuntu/yos/tools/extract_mac_chrome_cookies.py"
    description: "Cookie extractor — Brave + Chrome, AES decrypt, offset 32"
    location: "Cloud Computer"
  - path: "/home/ubuntu/yos/tools/refresh_chatgpt_cookies.sh"
