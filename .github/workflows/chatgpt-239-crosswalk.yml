name: ChatGPT 239 Ledger Crosswalk

on:
  pull_request:
    paths:
      - 08_LOGS/session-ledger/reconciliation/chatgpt-239/**
      - 08_LOGS/session-ledger/data/master_ledger.csv
      - .github/workflows/chatgpt-239-crosswalk.yml
  workflow_dispatch:

concurrency:
  group: chatgpt-239-crosswalk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Build crosswalk
        id: build
        shell: bash
        run: |
          set +e
          python3 08_LOGS/session-ledger/reconciliation/chatgpt-239/build_crosswalk.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit generated evidence
        run: |
          git add -f 08_LOGS/session-ledger/reconciliation/chatgpt-239/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(fusion): generate ChatGPT 239 ledger crosswalk"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Enforce hard validation
        if: steps.build.outputs.status != '0'
        run: |
          echo "Crosswalk validation returned status ${{ steps.build.outputs.status }}"
          exit "${{ steps.build.outputs.status }}"
